<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LLD Practice Platform{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            line-height: 1.6;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .card h2 {
            margin-bottom: 12px;
        }

        .card p {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .problem-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .problem-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .problem-card h2 {
            margin-bottom: 12px;
        }

        .problem-card p {
            margin-bottom: 15px;
        }

        .problem-detail {
            background: white;
            padding: 30px;
            max-width: 800px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .problem-detail h1 {
            margin-bottom: 20px;
        }

        .badges {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .badges span {
            background: #e5e7eb;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
        }

        .practice-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .practice-info {
            background: #f5f7fb;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .question-box,
        .solution-box {
            background: #f8fafc;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .practice-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .hint {
            background: #eff6ff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .history-list {
            display: grid;
            gap: 20px;
            margin-top: 25px;
        }

        .history-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .empty-state {
            background: white;
            text-align: center;
            padding: 50px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .learning-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 25px;
        }

        .feedback-container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        .feedback-container input,
        .feedback-container textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .features,
            .problem-grid,
            .learning-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 32px;
            }

            .practice-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            LLD Practice
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('problems') }}">Problems</a>

            <a href="{{ url_for('history') }}">History</a>

            <a href="{{ url_for('learning') }}">Learning</a>

            <a href="{{ url_for('feedback') }}">Feedback</a>

        </div>

    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
